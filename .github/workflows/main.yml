name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Node.js version
        run: node --version

      - name: Check application file
        run: test -f app.js

      - name: Build Docker image
        run: docker build -t devops-practice-app:latest .
